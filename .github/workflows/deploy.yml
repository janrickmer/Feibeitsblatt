# Feibeitsblatt – Deployment auf Cloudflare (Worker + D1 in der EU + statische Seite).
# Benötigte Repository-Secrets: CLOUDFLARE_API_TOKEN (Vorlage „Edit Cloudflare Workers“ + „Konto → D1 → Bearbeiten“),
# CLOUDFLARE_ACCOUNT_ID (optional, sonst das erste Konto des Tokens). Ohne Token wird nur ein Hinweis ausgegeben.
# Das Token bekommen nur die Schritte, die es brauchen (nicht npm ci und die Tests).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  check:
    name: Secrets prüfen
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deployment übersprungen::Das Secret CLOUDFLARE_API_TOKEN ist nicht gesetzt. Anleitung siehe README (Abschnitt Einrichtung)."
          fi

  deploy:
    name: Auf Cloudflare veröffentlichen
    needs: check
    if: needs.check.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren (wrangler 4.145.0 aus package-lock.json)
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: Unit-Tests
        run: npm test

      - name: Seite bauen (dist/)
        run: npm run build

      - name: Konto-ID ermitteln
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          ACC="$CLOUDFLARE_ACCOUNT_ID"
          if [ -z "$ACC" ]; then
            ACC=$(curl -fsS "https://api.cloudflare.com/client/v4/accounts" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | jq -r '.result[0].id // empty')
            if [ -z "$ACC" ]; then
              echo "::error::Konto-ID nicht ermittelbar. Bitte das Secret CLOUDFLARE_ACCOUNT_ID setzen."
              exit 1
            fi
          fi
          echo "::add-mask::$ACC"
          echo "CF_ACCOUNT=$ACC" >> "$GITHUB_ENV"

      - name: workers.dev-Subdomain sicherstellen (neue Konten haben keine)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          API="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/subdomain"
          RESP=$(curl -sS "$API" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          SUB=$(echo "$RESP" | jq -r '.result.subdomain // empty')
          if [ -n "$SUB" ]; then
            echo "workers.dev-Subdomain vorhanden."
          elif [ "$(echo "$RESP" | jq -r '.success')" = "true" ] || [ "$(echo "$RESP" | jq -r '.errors[0].code // empty')" = "10007" ]; then
            # Nur anlegen, wenn Cloudflare bestätigt, dass noch keine existiert – nie eine vorhandene umbenennen
            WANT="feibeitsblatt-$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]' | tr -cd 'a-z0-9-' | cut -c1-40)"
            curl -fsS -X PUT "$API" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" --data "{\"subdomain\":\"$WANT\"}" > /dev/null
            SUB="$WANT"
          else
            echo "::error::workers.dev-Subdomain konnte nicht abgefragt werden: $(echo "$RESP" | jq -c '.errors // .' | cut -c1-300)"
            exit 1
          fi
          echo "WORKERS_SUBDOMAIN=$SUB" >> "$GITHUB_ENV"

      - name: D1-Datenbank in der EU sicherstellen
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT }}
        run: |
          # Der Ort (EU) lässt sich nur beim Anlegen wählen – deshalb hier und nie per „wrangler deploy“ von Hand
          npx wrangler d1 info feibeitsblatt-db >/dev/null 2>&1 || npx wrangler d1 create feibeitsblatt-db --jurisdiction eu

      - name: Worker veröffentlichen
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT }}
        run: |
          # wrangler lädt erst den Code hoch und setzt danach die Zeitpläne (Cron Trigger für die automatische Löschung). Ist das
          # Cron-Kontingent des Kontos voll (Free: 5), scheitert nur dieser zweite Teil – der Code ist dann schon live.
          set -o pipefail
          if ! npx wrangler deploy 2>&1 | tee "$RUNNER_TEMP/deploy.log"; then
            if grep -q "Cron schedules" "$RUNNER_TEMP/deploy.log"; then
              echo "::error title=Zeitplan für die automatische Löschung nicht gesetzt::Der Worker ist veröffentlicht, aber der tägliche Zeitplan (Cron Trigger) ließ sich nicht setzen – meist ist das Cron-Kontingent des Cloudflare-Kontos voll. Gelöscht wird dann nur beim Öffnen der Lehrkräfte-Übersicht. Abhilfe: README, „Häufige Probleme“."
            fi
            exit 1
          fi

      # Läuft auch, wenn „Worker veröffentlichen“ gescheitert ist (z. B. nur am Zeitplan, siehe oben): Ohne SETTINGS_SECRET ließe sich
      # bei einer Neuinstallation kein API-Schlüssel speichern. Nicht, wenn der Deploy gar nicht lief (frühere Schritte gescheitert).
      - name: SETTINGS_SECRET sicherstellen (verschlüsselt den KI-Schlüssel, Pfeffer der Rate-Limits)
        if: ${{ !cancelled() && (steps.deploy.outcome == 'success' || steps.deploy.outcome == 'failure') }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT }}
        run: |
          # Nie überschreiben: ein neues Secret macht den gespeicherten KI-Schlüssel unlesbar
          if ! LIST=$(npx wrangler secret list --format json 2>&1); then
            echo "::error::Secret-Liste nicht abrufbar – bitte den Workflow erneut starten. Ohne SETTINGS_SECRET lässt sich kein KI-Schlüssel speichern."
            echo "$LIST" | tail -5
            exit 1
          elif echo "$LIST" | grep -q '"SETTINGS_SECRET"'; then
            echo "SETTINGS_SECRET ist bereits gesetzt."
          else
            openssl rand -base64 32 | tr -d '\n' | npx wrangler secret put SETTINGS_SECRET
          fi

      - name: Adresse ausgeben
        run: |
          echo "::notice title=Feibeitsblatt ist online::https://feibeitsblatt.${WORKERS_SUBDOMAIN}.workers.dev – bitte sofort öffnen, 1104 eingeben und das Lehrkraft-Passwort festlegen."
